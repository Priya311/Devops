<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Lumora</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #0d2427;
      --deep: #08393a;
      --teal: #12a594;
      --lime: #7ee8b0;
      --sun: #ffb84d;
      --coral: #ff7a59;
      --line: #d9e6e3;
      --bs-body-font-family: "DM Sans", system-ui, sans-serif;
    }
    * { -webkit-font-smoothing: antialiased; }
    html, body { min-height: 100%; }
    body {
      color: var(--ink); min-height: 100vh; position: relative; overflow-x: hidden;
      background:
        radial-gradient(800px 500px at 15% 10%, rgba(18,165,148,.35), transparent 60%),
        radial-gradient(700px 500px at 90% 90%, rgba(255,184,77,.30), transparent 60%),
        radial-gradient(600px 400px at 85% 5%, rgba(126,232,176,.30), transparent 60%),
        #eaf5f2;
    }
    /* soft dotted grid */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .6;
      background-image: radial-gradient(rgba(8,57,58,.16) 1px, transparent 1px); background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 75%);
              mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 75%);
    }
    h1, .brand { font-family: "Bricolage Grotesque", "DM Sans", sans-serif; letter-spacing: -.025em; }
    a { color: #0b7f72; text-decoration: none; font-weight: 500; }
    a:hover { color: var(--deep); text-decoration: underline; }

    .page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1rem; position: relative; z-index: 1; }

    .login-card {
      width: 100%; max-width: 440px; background: rgba(255,255,255,.95);
      border: 1px solid #fff; border-radius: 28px; padding: 2.5rem 2.3rem;
      box-shadow: 0 35px 80px -25px rgba(8,57,58,.35), 0 2px 6px rgba(8,57,58,.06);
      animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }

    .logo-mark {
      width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; color: #fff;
      background: linear-gradient(135deg, var(--sun), var(--coral)); box-shadow: 0 12px 24px rgba(255,122,89,.35);
    }
    .login-card h1 { font-size: 1.95rem; font-weight: 800; }
    .wave { display: inline-block; transform-origin: 70% 70%; animation: wave 2.4s .6s 1; }
    @keyframes wave { 0%,100% { transform: rotate(0); } 15% { transform: rotate(14deg); } 30% { transform: rotate(-8deg); } 45% { transform: rotate(14deg); } 60% { transform: rotate(-4deg); } 75% { transform: rotate(10deg); } }

    .form-control { border-radius: 14px; border: 1.5px solid var(--line); background: #f8fbfa; padding: .95rem .9rem; transition: all .2s; }
    .form-floating > .form-control { padding-top: 1.7rem; height: 3.75rem; }
    .form-control:hover { border-color: #b7d3ce; }
    .form-control:focus { border-color: var(--teal); background: #fff; box-shadow: 0 0 0 .28rem rgba(18,165,148,.16); }
    .form-floating > label { color: #6c8588; }
    .field-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #7a9094; z-index: 5; pointer-events: none; display: flex; transition: color .2s; }
    .has-icon .form-control { padding-left: 2.9rem; background-image: none !important; }
    .has-icon > label { padding-left: 2.9rem; }
    .has-icon:focus-within .field-icon { color: var(--teal); }
    .toggle-pass { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); z-index: 5; border: 0; background: transparent; color: #5b7377; width: 42px; height: 42px; border-radius: 10px; }
    .toggle-pass:hover { background: #e8f2f0; color: var(--ink); }

    .btn-signin {
      position: relative; overflow: hidden; border: 0; border-radius: 14px; color: #fff; font-weight: 600; font-size: 1.05rem; padding: 1rem;
      background: linear-gradient(135deg, #14b8a3 0%, #0b7f72 100%); box-shadow: 0 14px 28px -10px rgba(14,140,126,.65);
      transition: transform .15s, box-shadow .2s;
    }
    .btn-signin::after { content: ""; position: absolute; top: 0; left: -120%; width: 60%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-20deg); transition: left .6s; }
    .btn-signin:hover { color: #fff; transform: translateY(-2px); box-shadow: 0 18px 32px -10px rgba(14,140,126,.75); }
    .btn-signin:hover::after { left: 140%; }
    .btn-signin:active { transform: translateY(0); }
    .btn-signin .arrow { transition: transform .2s; }
    .btn-signin:hover .arrow { transform: translateX(4px); }
    .btn-signin:disabled { opacity: .85; color: #fff; }

    .btn-social { border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: .8rem 1rem; font-weight: 500; color: var(--ink); transition: all .2s; }
    .btn-social:hover { border-color: var(--teal); background: #f1fbf9; color: var(--ink); transform: translateY(-1px); box-shadow: 0 8px 18px -10px rgba(18,165,148,.5); }
    .divider { display: flex; align-items: center; gap: .8rem; color: #7a9094; font-size: .85rem; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .form-check-input { width: 1.1em; height: 1.1em; border-color: #b7cfcb; }
    .form-check-input:checked { background-color: var(--teal); border-color: var(--teal); }
    .form-check-input:focus { box-shadow: 0 0 0 .25rem rgba(18,165,148,.18); border-color: var(--teal); }
    .alert-soft { border-radius: 14px; background: #fff3f1; border: 1px solid #ffd2cb; color: #9c2c1c; font-size: .93rem; }
    .secure { display: inline-flex; align-items: center; gap: .4rem; font-size: .8rem; color: #5f7a7d; }
    .spinner-border-sm { --bs-spinner-width: 1rem; --bs-spinner-height: 1rem; }

    @media (max-width: 575.98px) { .login-card { padding: 2rem 1.35rem; border-radius: 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<main class="page">
  <div class="login-card">

    <div class="text-center mb-4">
      <a href="/" class="d-inline-flex flex-column align-items-center gap-2 text-decoration-none" style="color:var(--ink)">
        <span class="logo-mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 2 4 13.5h6.5L9.5 22 20 9.5h-6.8z"/></svg></span>
        <span class="brand fs-4 fw-bold">Lumora</span>
      </a>
    </div>

    <h1 class="text-center mb-2">Welcome back <span class="wave" aria-hidden="true">👋</span></h1>
    <p class="text-secondary text-center mb-4">Sign in to your account to continue.</p>

    <div id="formError" class="alert-soft p-3 mb-3 d-none" role="alert">
      <svg class="me-1" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>
      Email or password is incorrect. Try again or reset your password.
    </div>

    <form id="loginForm" novalidate>
      <div class="form-floating has-icon mb-3 position-relative">
        <span class="field-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5 12 13l8.5-5.5"/></svg></span>
        <input type="email" class="form-control" id="email" placeholder="you@company.com" autocomplete="email" required>
        <label for="email">Email address</label>
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>

      <div class="form-floating has-icon mb-3 position-relative">
        <span class="field-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.5v2.5"/></svg></span>
        <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" minlength="8" required>
        <label for="password">Password</label>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Show password">
          <svg id="eyeOn" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeOff" class="d-none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.3 6.4C3.7 8.1 2 12 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
        </button>
        <div class="invalid-feedback">Password must be at least 8 characters.</div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Keep me signed in</label>
        </div>
        <a href="#" class="small">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-signin w-100 d-flex justify-content-center align-items-center gap-2" id="submitBtn">
        <span class="spinner-border spinner-border-sm d-none" id="spinner" aria-hidden="true"></span>
        <span id="btnText">Sign in</span>
        <svg class="arrow" id="arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <div class="divider my-4">or continue with</div>

    <div class="row g-2">
      <div class="col-6">
        <button class="btn btn-social w-100 d-flex justify-content-center align-items-center gap-2" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7a14.5 14.5 0 0 1 0-9.4l-7.9-6.1a24 24 0 0 0 0 21.6l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Google</button>
      </div>
      <div class="col-6">
        <button class="btn btn-social w-100 d-flex justify-content-center align-items-center gap-2" type="button">
          <svg width="20" height="20" viewBox="0 0 23 23" aria-hidden="true"><path fill="#F25022" d="M1 1h10v10H1z"/><path fill="#7FBA00" d="M12 1h10v10H12z"/><path fill="#00A4EF" d="M1 12h10v10H1z"/><path fill="#FFB900" d="M12 12h10v10H12z"/></svg>Microsoft</button>
      </div>
    </div>

    <p class="text-center text-secondary mt-4 mb-3">New to Lumora? <a href="#">Create an account</a></p>
    <div class="text-center">
      <span class="secure">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.2 7.5 9.5 4.4-1.3 7.5-4.9 7.5-9.5V6z"/><path d="M8.7 12.2l2.4 2.4 4.3-4.6"/></svg>
        256-bit encrypted connection
      </span>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const errorBox = document.getElementById('formError');

  // Show / hide password
  document.getElementById('togglePass').addEventListener('click', (e) => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    document.getElementById('eyeOn').classList.toggle('d-none', show);
    document.getElementById('eyeOff').classList.toggle('d-none', !show);
    e.currentTarget.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Validate + submit
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    errorBox.classList.add('d-none');

    const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    const passOk = password.value.length >= 8;
    email.classList.toggle('is-invalid', !emailOk);
    password.classList.toggle('is-invalid', !passOk);
    if (!emailOk || !passOk) return;

    const btn = document.getElementById('submitBtn');
    const setBusy = (on) => {
      btn.disabled = on;
      document.getElementById('spinner').classList.toggle('d-none', !on);
      document.getElementById('arrow').classList.toggle('d-none', on);
      document.getElementById('btnText').textContent = on ? 'Signing in…' : 'Sign in';
    };
    setBusy(true);

    /* ----- Replace this block with your real login request -----
       fetch('/api/login', {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({ email: email.value, password: password.value })
       }).then(r => r.ok ? location.href = '/dashboard' : Promise.reject());
    ------------------------------------------------------------- */
    setTimeout(() => { setBusy(false); errorBox.classList.remove('d-none'); }, 1400); // demo only
  });

  [email, password].forEach(el => el.addEventListener('input', () => el.classList.remove('is-invalid')));
</script>
</body>
</html>
